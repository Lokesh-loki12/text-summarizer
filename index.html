<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Text Summarizer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #FFF7ED;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #FB923C;
        }

        h3 {
            text-align: center;
            margin-top: -10px;
            margin-bottom: 30px;
        }

        p {
            line-height: 1.5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            background-color: #FB923C;
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #F97316;
        }

        button:disabled {
            background-color: #FDBA74;
            cursor: not-allowed;
        }

        #summary-output {
            margin-top: 25px;
            background: #FFEDD5;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            overflow-wrap: anywhere;
        }

        #summary-heading {
            margin: 0 0 15px;
        }

        #summary-text {
            white-space: pre-wrap;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Text Summarizer</h1>

        <h3>using HuggingFace Transformer</h3>

        <p>
            Write or paste your content below for quick summarization.
        </p>

        <form id="summarization-form">

            <textarea
                id="dialogue-input"
                placeholder="Enter your content here..."
                required
            ></textarea>

            <button type="submit">
                Summarize
            </button>

        </form>

        <div id="summary-output">

            <h3 id="summary-heading">
                Content Summary
            </h3>

            <p id="summary-text">
                Your summary will appear here.
            </p>

        </div>

    </div>

    <script>
        const form = document.getElementById(
            "summarization-form"
        );

        const dialogueInput = document.getElementById(
            "dialogue-input"
        );

        const summaryText = document.getElementById(
            "summary-text"
        );

        const submitButton = form.querySelector(
            "button[type='submit']"
        );

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const dialogue = dialogueInput.value.trim();

            if (!dialogue) {
                summaryText.innerText =
                    "Please enter some text to summarize.";
                return;
            }

            submitButton.disabled = true;
            submitButton.innerText = "Summarizing...";

            summaryText.innerText =
                "Processing your text. Please wait...";

            try {

                const response = await fetch("/summarize/", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        dialogue: dialogue
                    })
                });

                // Read the response
                const data = await response.json();

                // Handle API errors
                if (!response.ok) {
                    throw new Error(
                        data.detail ||
                        `Server error: ${response.status}`
                    );
                }

                // Display generated summary
                summaryText.innerText =
                    data.summary ||
                    "The model returned an empty summary.";

            } catch (error) {

                console.error(
                    "Summarization error:",
                    error
                );

                summaryText.innerText =
                    "Error: " + error.message;

            } finally {

                submitButton.disabled = false;
                submitButton.innerText = "Summarize";

            }

        });
    </script>

</body>

</html>
